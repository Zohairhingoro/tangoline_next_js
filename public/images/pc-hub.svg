<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="pcBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#141722" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1a26" />
      <stop offset="100%" stop-color="#e50914" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e3d" />
      <stop offset="50%" stop-color="#181b24" />
      <stop offset="100%" stop-color="#0d0e14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#pcBgGrad)"/>

  <!-- Circuit Pattern Accents -->
  <g stroke="#262c3e" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 50,50 L 180,50 L 230,100 L 400,100" />
    <path d="M 620,80 L 700,80 L 750,130 L 750,300" />
    <path d="M 80,480 L 150,550 L 300,550" />
    <path d="M 520,530 L 660,530 L 720,470" />
    <circle cx="400" cy="100" r="4" fill="#00f2fe"/>
    <circle cx="180" cy="50" r="4" fill="#e50914"/>
    <circle cx="750" cy="300" r="4" fill="#00f2fe"/>
    <circle cx="300" cy="550" r="4" fill="#e50914"/>
  </g>

  <!-- Graphics Card (GPU) Outline -->
  <g transform="translate(160, 110)">
    <!-- Backplate & Shroud -->
    <rect x="0" y="30" width="480" height="240" rx="16" fill="url(#gpuGrad)" stroke="#3e4559" stroke-width="3" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
    
    <!-- Top Accent Bar / RGB Strip -->
    <path d="M 20,45 L 460,45" stroke="url(#neonRed)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 20,45 L 200,45" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Triple Fans -->
    <!-- Fan 1 -->
    <circle cx="95" cy="150" r="62" fill="#121318" stroke="#333847" stroke-width="3"/>
    <circle cx="95" cy="150" r="62" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6" stroke-dasharray="8 6"/>
    <circle cx="95" cy="150" r="22" fill="#202430" stroke="url(#neonCyan)" stroke-width="2"/>
    <!-- Fan 1 Blades -->
    <path d="M 95,95 C 115,110 115,135 95,150 C 75,135 75,110 95,95 Z" fill="#282d3d" opacity="0.8"/>
    <path d="M 95,205 C 115,190 115,165 95,150 C 75,165 75,190 95,205 Z" fill="#282d3d" opacity="0.8"/>
    <path d="M 40,150 C 55,170 80,170 95,150 C 80,130 55,130 40,150 Z" fill="#282d3d" opacity="0.8"/>
    <path d="M 150,150 C 135,170 110,170 95,150 C 110,130 135,130 150,150 Z" fill="#282d3d" opacity="0.8"/>

    <!-- Fan 2 (Center) -->
    <circle cx="240" cy="150" r="62" fill="#121318" stroke="#333847" stroke-width="3"/>
    <circle cx="240" cy="150" r="62" fill="none" stroke="url(#neonRed)" stroke-width="2.5" opacity="0.8" stroke-dasharray="12 4" filter="url(#glow)"/>
    <circle cx="240" cy="150" r="22" fill="#202430" stroke="url(#neonRed)" stroke-width="2"/>
    <!-- Fan 2 Blades -->
    <path d="M 240,95 C 260,110 260,135 240,150 C 220,135 220,110 240,95 Z" fill="#2f3447" opacity="0.85"/>
    <path d="M 240,205 C 260,190 260,165 240,150 C 220,165 220,190 240,205 Z" fill="#2f3447" opacity="0.85"/>
    <path d="M 185,150 C 200,170 225,170 240,150 C 225,130 200,130 185,150 Z" fill="#2f3447" opacity="0.85"/>
    <path d="M 295,150 C 280,170 255,170 240,150 C 255,130 280,130 295,150 Z" fill="#2f3447" opacity="0.85"/>

    <!-- Fan 3 -->
    <circle cx="385" cy="150" r="62" fill="#121318" stroke="#333847" stroke-width="3"/>
    <circle cx="385" cy="150" r="62" fill="none" stroke="url(#neonCyan)" stroke-width="2" opacity="0.6" stroke-dasharray="8 6"/>
    <circle cx="385" cy="150" r="22" fill="#202430" stroke="url(#neonCyan)" stroke-width="2"/>
    <!-- Fan 3 Blades -->
    <path d="M 385,95 C 405,110 405,135 385,150 C 365,135 365,110 385,95 Z" fill="#282d3d" opacity="0.8"/>
    <path d="M 385,205 C 405,190 405,165 385,150 C 365,165 365,190 385,205 Z" fill="#282d3d" opacity="0.8"/>
    <path d="M 330,150 C 345,170 370,170 385,150 C 370,130 345,130 330,150 Z" fill="#282d3d" opacity="0.8"/>
    <path d="M 440,150 C 425,170 400,170 385,150 C 400,130 425,130 440,150 Z" fill="#282d3d" opacity="0.8"/>

    <!-- PCIe Gold Finger Pins -->
    <rect x="60" y="270" width="220" height="16" fill="#d4af37" rx="2" stroke="#aa8c2c" stroke-width="1"/>
    <line x1="120" y1="270" x2="120" y2="286" stroke="#1a1c22" stroke-width="4"/>
  </g>

  <!-- CPU Processor Chip (Front Foreground Left) -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="130" height="130" rx="10" fill="#242731" stroke="#484f63" stroke-width="2.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
    <rect x="15" y="15" width="100" height="100" rx="6" fill="#171922" stroke="#d4af37" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="4" fill="#d4af37"/>
    <text x="65" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">PROCESSOR</text>
    <text x="65" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#e50914" text-anchor="middle" letter-spacing="2">6.0 GHz</text>
  </g>

  <!-- High-Speed RAM Stick (Foreground Right) -->
  <g transform="translate(560, 310)">
    <rect x="0" y="0" width="140" height="130" rx="8" fill="#1b1e28" stroke="#3d4458" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
    <rect x="10" y="8" width="120" height="14" rx="4" fill="url(#neonCyan)" filter="url(#glow)"/>
    <text x="70" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">DDR5 RGB</text>
    <text x="70" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00f2fe" text-anchor="middle">6400 MT/s</text>
    <rect x="20" y="112" width="100" height="10" fill="#d4af37" rx="1"/>
  </g>

  <!-- Typography Banner -->
  <g transform="translate(400, 500)" text-anchor="middle">
    <text y="0" font-family="'Segoe UI', Roboto, 'Quicksand', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="4">
      PC PARTS &amp; HARDWARE
    </text>
    <text y="32" font-family="'Segoe UI', Roboto, 'Quicksand', sans-serif" font-size="15" font-weight="600" fill="#e50914" letter-spacing="3">
      PRO GAMING COMPONENTS &amp; CUSTOM RIGS
    </text>
  </g>
</svg>
